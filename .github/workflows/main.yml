
name: Build JAIMS Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK   uses: android-actions/setup-android@v3   with:     log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APKs
        run: gradle --no-daemon :idcopy:assembleDebug :pdfpro:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: JAIMS-Android-APK
          path: |
            idcopy/build/outputs/apk/debug/*.apk
            pdfpro/build/outputs/apk/debug/*.apk
